    <!--Formulario de registro-->
    <form>
        <label for="nombre">Ingrese su nombre"</label>
            <br>
            <input type="text" id="nombre" placeholder="nombre" side="10" required>
            <br><br>
            <label for="email">ingrese su email</label>
            <br>
            <input type="email" id="email" placeholder="email" required>
            <br><br>
            <label for="passw">Ingrese su contraseña</label>
            <br>
            <input type="password" id="passw" placeholder="contraseña" required>
            <br><br>
            <label for="fecha:_nacimiento">Fecha de nacimiento</label>
            <br>
            <input type="date" id="fecha_nacimiento" required>
            <br><br>
            <label for="cargas_familiares">Cargas Familiares</label>
            <br>
            <input type="number" id="Cargas Familiares" required>
            <br><br>
            <label for="#">Genero</label
                <br>
                <label for="masculino">
                    <input type="radio" id="masculino">Masculino

                </label>
                <label for="femenino">
                    <input type="radio" id="femenino">Femenino
                </label>
                <label for="otro">
                    <input type="radio" id="otro" name="genero">otro
                </label>
                    <br><br>
                <label for="ciudad">Seleccione la ciudad</label>
                <select name="Ciudad" id="ciudad">
                       <option value="opcion" disable selec>Seleccionar opción</option>
                    <option value="quito">Quito</option>
                    <option value="cuenca">Cuenca</option>
                    <option value="latacunga">Latacunga</option>
                    <option value="ibarra">Ibarra</option>
                </select>
                <br><br>
                <label for="foto">Seleccione su foto</label>
                <br>
                <input type="file" id="foto">
                <br><br>
                <label for="comentario">Deje sus comentarios</label>
                <br>
                <textarea name="comentarios" id="comentarios" cols="20" rows="5"
                placeholder="Escriba sus comentario"></textarea>
                <br><br
            <!--Botones
                button = botón simple, sin funció<
                submit = botón que envia datos(DB)
                reset = limpiar el formulario
            -->
                <button>Botón simple</button>
                <input type="submit" value="Enviar">
                <button type="reset">Limpia </button>
            </form>
</body>
